<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Setlist - Gestor de Playlists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./CSS/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">🎵</span>
        <h1 class="brand-name">Mi Setlist</h1>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-header">
          <h2 class="sidebar-label">Mis Playlists</h2>
          <button id="btn-create-playlist" class="btn btn-pill">+ Nueva</button>
        </div>
        <div id="playlists-list" class="playlists-list"></div>
      </div>
    </aside>

    <main class="main-container">
      <!-- Vista Principal: Buscador y Resultados -->
      <section id="search-section" class="view-section">
        <div class="search-hero">
          <p class="hero-eyebrow">Buscar</p>
          <form id="search-form" class="search-box">
            <input
              type="text"
              id="search-input"
              placeholder="Buscar canción, artista o álbum..."
              required
              autocomplete="off"
            />
            <button type="submit" class="btn btn-primary">Buscar</button>
          </form>
        </div>

        <div class="content-layout">
          <article class="results-column">
            <h2 class="section-title">Resultados de búsqueda</h2>
            <div id="search-results" class="results-grid">
              <p class="text-muted">Ingresa el nombre de un artista o canción para comenzar la búsqueda.</p>
            </div>
          </article>
        </div>
      </section>

      <!-- Vista de Detalle de Playlist (HU5) -->
      <section id="detail-section" class="view-section" style="display: none;"></section>
    </main>
  </div>

  <script type="module" src="./JS/app.js"></script>
</body>
</html>
